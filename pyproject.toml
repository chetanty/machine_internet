[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "machine-internet"
version = "0.1.2"
description = "Turn any website into an MCP server. No API needed."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "ai-agents", "claude", "api", "scraping", "openapi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Intended Audience :: Developers",
]
dependencies = [
    "mcp>=1.27,<2",
    "httpx>=0.27.0",
    "playwright>=1.44.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "click>=8.1.7",
    "PyYAML>=6.0.1",
    "uvicorn>=0.30.0",
    "anthropic>=2.8.0",
    "openai>=1.0.0",
    "google-genai>=0.5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2.0", "pytest-asyncio>=0.23.0"]

[project.scripts]
machine-internet = "machine_internet.cli:main"

[project.urls]
Homepage = "https://github.com/chetanty/machine_internet"

[tool.hatch.build.targets.wheel]
packages = ["machine_internet"]

[tool.hatch.build.targets.sdist]
include = ["machine_internet", "README.md", "LICENSE"]
