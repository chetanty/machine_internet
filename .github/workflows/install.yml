name: README install

# Runs the exact command from the README against the package on PyPI, so a broken release
# (or a dependency that breaks it later) shows up here instead of in a user's terminal.
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  uvx:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: astral-sh/setup-uv@v6
      - name: uvx machine-internet (from PyPI)
        run: |
          uvx machine-internet --version
          uvx machine-internet list
          uvx machine-internet tools yc_companies
